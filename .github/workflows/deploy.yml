name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --prefer-offline

      - name: Build assets
        run: npm run build

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Build lftp script
        run: |
          # Get changed files from last commit + built assets
          git diff --name-only HEAD~1 HEAD > /tmp/raw_files.txt
          find public/build -type f >> /tmp/raw_files.txt
          sort -u /tmp/raw_files.txt > /tmp/all_files.txt

          # Build lftp commands (one connection, all puts)
          echo "set ssl:verify-certificate false" > /tmp/deploy.lftp
          echo "open -u ${{ secrets.FTP_USER }},${{ secrets.FTP_PASS }} ftp://${{ secrets.FTP_HOST }}" >> /tmp/deploy.lftp

          while IFS= read -r file; do
            # Skip excluded paths
            if echo "$file" | grep -qE "^(\.git|node_modules|\.env|vendor/|storage/logs|storage/framework/(cache|sessions|views)|public/js/filament|public/css/filament|public/fonts/filament)"; then
              continue
            fi
            if [ ! -f "$file" ]; then continue; fi
            DIR=$(dirname "$file")
            echo "mkdir -p httpdocs/$DIR" >> /tmp/deploy.lftp
            echo "put $file -o httpdocs/$file" >> /tmp/deploy.lftp
          done < /tmp/all_files.txt

          echo "bye" >> /tmp/deploy.lftp
          echo "=== Files to deploy ==="
          grep "^put" /tmp/deploy.lftp | sed 's/put //' | awk '{print $1}'

      - name: Deploy via FTP
        run: lftp -f /tmp/deploy.lftp
