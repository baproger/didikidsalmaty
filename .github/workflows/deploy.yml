name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          lftp -c "
            set ssl:verify-certificate false;
            set ftp:ssl-allow true;
            open -u $FTP_USER,$FTP_PASS ftp://$FTP_HOST;
            mirror -R --verbose --delete \
              --exclude-glob .git \
              --exclude-glob .github \
              --exclude-glob node_modules \
              --exclude-glob .env \
              --exclude-glob vendor \
              --exclude-glob storage/logs \
              --exclude-glob storage/framework/cache \
              --exclude-glob storage/framework/sessions \
              --exclude-glob storage/framework/views \
              --exclude-glob public/js/filament \
              --exclude-glob public/css/filament \
              --exclude-glob public/fonts/filament \
              . /;
            bye;
          "
